<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Générateur de mots de passe · EDEN School</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Étape JavaScript : charge assets/hasard.js puis script.js ici avec defer. -->
  </head>
  <body>
    <div class="box">
      <div class="top">
        <div class="left">
          <p class="text1">Eden School</p>
          <h1 class="text2">Générateur de mots de passe</h1>
        </div>
        <div class="right"><img src="cle.svg" alt="" /></div>
      </div>
      <div class="bottom">
        <h4 class="text3">Mot de passe</h4>
        <input id="mot-de-passe" type="text" placeholder="En attente de clic" />
        <button id="generer-mot-de-passe" class="genmdp">
          Generer mot de passe
        </button>
      </div>
    </div>
    <script>
      function generatePassword() {
        var password = "";
        var possible =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,-./:;<=>?@[]^_`{|}~";
        for (var i = 0; i < 15; i++) {
          password += possible.charAt(
            Math.floor(Math.random() * possible.length),
          );
        }
        return password;
      }
      //selectioner l'element html qui possede l'id du boutton
      const button = document.getElementById("generer-mot-de-passe");
      const input = document.getElementById("mot-de-passe");

      button.addEventListener("click", () => {
        console.log("pigeon ");
        input.style.background = "red";
        input.value = generatePassword();
      });
    </script>
  </body>
</html>
